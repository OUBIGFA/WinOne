[package]
name = "winone-selection-reader"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
