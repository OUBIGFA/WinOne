[package]
name = "winone-recording"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "winone_recording"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-capture = "=2.0.1"
gifski = { version = "=1.34.0", path = "../../third_party/gifski", default-features = false }
crossbeam-channel = "=0.5.15"
parking_lot = "=0.12.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = [
  "Foundation", "Graphics_DirectX_Direct3D11", "Media_Core", "Media_MediaProperties",
  "Media_Transcoding", "Security_Cryptography", "Storage", "Storage_Streams", "System_Threading",
  "Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging",
  "Win32_Media_MediaFoundation"
] }

[dev-dependencies]
gif = "0.14.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
